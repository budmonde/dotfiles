# Shared agentic configuration applied before the platform-specific fragment.

- defaults:
    link:
        create: true
        relink: true

- clean:
    - ~/.config/claude
    - ~/.config/codex
    - ~/.config/opencode

- link:
    ~/.agents: config/agents
    ~/.config/codex/AGENTS.md: config/agents/AGENTS.md
    ~/.config/codex/config.toml: config/codex/config.toml
    ~/.config/claude/settings.json: config/claude/settings.json
    ~/.config/claude/keybindings.json: config/claude/keybindings.json

    ~/.config/opencode: config/opencode

- shell:
    - ["npm install -g '@openai/codex'", Installing Codex]
    - ["npm install -g '@anthropic-ai/claude-code'", Installing Claude Code]
