schema_version: 2

checks:
  vlc:
    commands:
      installed: ["if (((winget list --id VideoLAN.VLC 2>$null) | Out-String) -match 'VideoLAN.VLC') { 'installed' } else { 'missing' }", installed]

  ffmpeg:
    commands:
      installed: ["if (((winget list --id Gyan.FFmpeg 2>$null) | Out-String) -match 'Gyan.FFmpeg') { 'installed' } else { 'missing' }", installed]
