# Profile: wsl — install WSL
# Usage: .\install-profile.ps1 wsl
# Note: WSL install requires admin privileges and may trigger a reboot.

- shell:
    - command: powershell -NonInteractive -Command "wsl --install --no-launch"
      description: Installing WSL
    - command: powershell -NonInteractive -Command "shellver bump machine"
      description: Refreshing Shellver machine generation
