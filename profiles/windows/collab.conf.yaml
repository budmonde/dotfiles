# Profile: collab — online collaboration tools
# Usage: .\install-profile.ps1 collab

- shell:
    - command: powershell -NonInteractive -File install\windows\winget-install.ps1 -PackageId Discord.Discord
      description: Installing Discord
    - command: powershell -NonInteractive -File install\windows\winget-install.ps1 -PackageId SlackTechnologies.Slack
      description: Installing Slack
    - command: powershell -NonInteractive -File install\windows\winget-install.ps1 -PackageId Google.GoogleDrive
      description: Installing Google Drive
    - command: powershell -NonInteractive -File install\windows\winget-install.ps1 -PackageId Zoom.Zoom
      description: Installing Zoom
    - command: powershell -NonInteractive -Command "shellver bump machine"
      description: Refreshing Shellver machine generation
