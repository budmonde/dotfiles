# Profile: creative — digital art and photography tools
# Usage: .\install-profile.ps1 creative

- install:
    - [install/windows/winget/blender.ps1, Installing Blender]
    - [install/windows/winget/darktable.ps1, Installing darktable]
    - [install/windows/winget/figma.ps1, Installing Figma]
