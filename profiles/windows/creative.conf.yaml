# Profile: creative — digital art and photography tools
# Usage: .\install-profile.ps1 creative

- shell:
    - command: powershell -NonInteractive -File install\windows\winget-install.ps1 -PackageId BlenderFoundation.Blender
      description: Installing Blender
    - command: powershell -NonInteractive -File install\windows\winget-install.ps1 -PackageId darktable.darktable
      description: Installing Darktable
    - command: powershell -NonInteractive -File install\windows\winget-install.ps1 -PackageId Figma.Figma
      description: Installing Figma
    - command: powershell -NonInteractive -File install\windows\winget-install.ps1 -PackageId GIMP.GIMP
      description: Installing GIMP
    - command: powershell -NonInteractive -File install\windows\winget-install.ps1 -PackageId Inkscape.Inkscape
      description: Installing Inkscape
    - command: powershell -NonInteractive -Command "shellver bump machine"
      description: Refreshing Shellver machine generation
