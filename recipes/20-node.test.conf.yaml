schema_version: 3

checks:
  fnm:
    paths: [fnm]
    commands:
      version: [fnm --version]

  node:
    paths: [node, corepack]
    commands:
      node-version: [node --version]
      corepack-version: [corepack --version]

  npm:
    links:
      "~/.config/npm": config/npm
    paths: [npm, npx]
    commands:
      npm-version: [npm --version]
      npx-version: [npx --version]
