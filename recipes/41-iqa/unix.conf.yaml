# Recipe: 41-iqa — image quality assessment tools
# Usage: ./install.sh --recipe iqa
#
# Installs VLC and FFmpeg via apt-get on Debian/Ubuntu. Operators on
# non-apt distros or macOS install these out-of-band (brew, dnf, etc.).

- install:
    - [[install/resources/apt-package.sh, vlc], Installing VLC]
    - [[install/resources/apt-package.sh, ffmpeg], Installing FFmpeg]
