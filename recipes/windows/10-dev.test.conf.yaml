schema_version: 3

checks:
  go:
    commands:
      workspace:
        - >-
          $expected = [IO.Path]::GetFullPath((Join-Path $env:XDG_DATA_HOME "go"));
          $actual = [IO.Path]::GetFullPath((go env GOPATH).Trim());
          if ($actual -ieq $expected) { "configured" } else { "misconfigured" }
        - configured
      module-cache:
        - >-
          $expected = [IO.Path]::GetFullPath((Join-Path $env:XDG_CACHE_HOME "go\mod"));
          $actual = [IO.Path]::GetFullPath((go env GOMODCACHE).Trim());
          if ($actual -ieq $expected) { "configured" } else { "misconfigured" }
        - configured

  visual-studio:
    commands:
      installed: ["if (((winget list --id Microsoft.VisualStudio.2022.Community 2>$null) | Out-String) -match 'Microsoft.VisualStudio.2022.Community') { 'installed' } else { 'missing' }", installed]

  cmake:
    commands:
      installed: ["if (((winget list --id Kitware.CMake 2>$null) | Out-String) -match 'Kitware.CMake') { 'installed' } else { 'missing' }", installed]

  make:
    commands:
      installed: ["if (((winget list --id ezwinports.make 2>$null) | Out-String) -match 'ezwinports.make') { 'installed' } else { 'missing' }", installed]

  nsight-compute:
    commands:
      installed: ["if (((winget list --id Nvidia.Nsight.Compute 2>$null) | Out-String) -match 'Nvidia.Nsight.Compute') { 'installed' } else { 'missing' }", installed]
