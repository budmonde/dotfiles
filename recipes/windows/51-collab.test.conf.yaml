schema_version: 3

checks:
  discord:
    commands:
      installed: ["if (((winget list --id Discord.Discord 2>$null) | Out-String) -match 'Discord.Discord') { 'installed' } else { 'missing' }", installed]

  slack:
    commands:
      installed: ["if (((winget list --id SlackTechnologies.Slack 2>$null) | Out-String) -match 'SlackTechnologies.Slack') { 'installed' } else { 'missing' }", installed]

  google-drive:
    commands:
      installed: ["if (((winget list --id Google.GoogleDrive 2>$null) | Out-String) -match 'Google.GoogleDrive') { 'installed' } else { 'missing' }", installed]

  zoom:
    commands:
      installed: ["if (((winget list --id Zoom.Zoom 2>$null) | Out-String) -match 'Zoom.Zoom') { 'installed' } else { 'missing' }", installed]
