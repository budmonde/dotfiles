schema_version: 2

checks:
  autohotkey:
    links:
      "%APPDATA%\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\startup.ahk": config/ahk/startup.ahk
    commands:
      installed: ["if (((winget list --id AutoHotkey.AutoHotkey 2>$null) | Out-String) -match 'AutoHotkey.AutoHotkey') { 'installed' } else { 'missing' }", installed]

  powertoys:
    links:
      "~/.config/powertoys/settings": config/powertoys/settings
      "~/.local/bin/Sync-PowerToysSettings.ps1": bin/Sync-PowerToysSettings.ps1
    commands:
      installed: ["if (((winget list --id Microsoft.PowerToys 2>$null) | Out-String) -match 'Microsoft.PowerToys') { 'installed' } else { 'missing' }", installed]
      settings-state: ["powershell -NoProfile -NonInteractive -File \"$HOME/.local/bin/Sync-PowerToysSettings.ps1\" -Check", PowerToys settings match the declared state]

  command-palette:
    links:
      "~/.config/cmdpal/settings": config/cmdpal/settings
      "~/.local/bin/Sync-CmdPalSettings.ps1": bin/Sync-CmdPalSettings.ps1
    commands:
      installed: ["if (Get-AppxPackage -Name Microsoft.CommandPalette) { 'installed' } else { 'missing' }", installed]
      settings-state: ["powershell -NoProfile -NonInteractive -File \"$HOME/.local/bin/Sync-CmdPalSettings.ps1\" -Check", Command Palette settings match the declared state]

  vscode:
    links:
      "~/.config/Code/User/keybindings.json": config/vscode/keybindings.json
      "~/.config/Code/User/settings.json": config/vscode/settings.json
    commands:
      installed: ["if (((winget list --id Microsoft.VisualStudioCode 2>$null) | Out-String) -match 'Microsoft.VisualStudioCode') { 'installed' } else { 'missing' }", installed]

  firefox:
    commands:
      installed: ["if (((winget list --id Mozilla.Firefox 2>$null) | Out-String) -match 'Mozilla.Firefox') { 'installed' } else { 'missing' }", installed]
