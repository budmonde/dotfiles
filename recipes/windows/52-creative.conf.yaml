# Recipe: 52-creative — digital art and photography tools
# Usage: .\install.ps1 --recipe creative

- install:
    - [install/windows/winget/blender.ps1, Installing Blender]
    - [install/windows/winget/darktable.ps1, Installing darktable]
    - [install/windows/winget/figma.ps1, Installing Figma]
    - [install/windows/winget/gimp.ps1, Installing GIMP]
    - [install/windows/winget/inkscape.ps1, Installing Inkscape]

- shell:
    - command: powershell -NonInteractive -Command "shellver bump machine"
      description: Refreshing Shellver machine generation
