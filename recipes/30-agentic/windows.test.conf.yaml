schema_version: 3

checks:
  codex:
    links:
      "~/.config/codex/config.toml": config/codex/windows.config.toml
    commands:
      home:
        command: >-
          $report = codex doctor --json | ConvertFrom-Json;
          $actual = [IO.Path]::GetFullPath([string]$report.checks."config.load".details.CODEX_HOME);
          $expected = [IO.Path]::GetFullPath($env:CODEX_HOME);
          if ($actual -ieq $expected) { "configured" } else { "misconfigured" }
        patterns: [configured]
        timeout: 30

  codex-environment:
    commands:
      home:
        - >-
          $actual = [Environment]::GetEnvironmentVariable('CODEX_HOME', 'User');
          $expected = Join-Path ([Environment]::GetFolderPath('UserProfile')) '.config\codex';
          if ($actual -and [IO.Path]::GetFullPath($actual).TrimEnd('\', '/') -ieq
          [IO.Path]::GetFullPath($expected).TrimEnd('\', '/')) { 'configured' } else { 'drifted' }
        - configured
