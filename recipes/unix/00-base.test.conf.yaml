schema_version: 3

checks:
  python:
    paths: [python3]
    commands:
      version: [python3 --version, '^Python 3\.(?:[89]|[1-9][0-9])\.']
      environment-count: ["uv python list --only-installed | grep -c .", '^[1-9][0-9]*\s*$']
      installed-versions: [uv python list --only-installed]

  fzf:
    paths:
      fzf-tmux:
        locations: ["${XDG_DATA_HOME:-$HOME/.local/share}/fzf/bin"]

  zsh:
    links:
      "~/.zshenv": config/zshenv
      "~/.zshrc": config/zshrc
      "~/.config/zsh": config/zsh
    paths: [zsh]
    commands:
      version: [zsh --version, zsh]
      configuration: ["zsh -ic 'print -r -- \"$KEYTIMEOUT\"'", '(?m)^1$']

  tmux:
    links:
      "~/.config/tmux": config/tmux
    files:
      "~/.config/tmux/plugins/tpm/tpm": file
      "~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux": file
      "~/.config/tmux/plugins/tmux-continuum/continuum.tmux": file
    paths: [tmux]
    commands:
      plugin-state: [DOTBOT_INSTALL_REPO_ROOT="$PWD" ./install/unix/tmux-plugins status, '(?m)^current$']
      version: [tmux -V, tmux]
      configuration:
        - >-
          tmux -L dotfiles-test-$$ -f "$HOME/.config/tmux/tmux.conf"
          start-server \; show-options -gv prefix \; list-keys -T prefix I \; kill-server
        - C-a
        - run-shell

  push-notify:
    if: 'test -n "$WSL_DISTRO_NAME"'
    links:
      "~/.local/bin/push-notify": bin/push-notify
    paths:
      push-notify:
        locations: [~/.local/bin]
    commands:
      notification: ['push-notify --silent "dotfiles environment test" "push-notify validation"']
