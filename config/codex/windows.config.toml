model = "gpt-6.2-sol"
model_reasoning_effort = "high"

[tui]
session_picker_view = "comfortable"
screen_reader_detection_done = true

[tui.keymap.editor]
insert_newline = ["ctrl-j", "ctrl-m", "enter", "shift-enter", "alt-enter", "ctrl-enter"]

[tui.model_availability_nux]
"gpt-5.5" = 1
"gpt-5.6-sol" = 4
"gpt-6.1-sol" = 4

[windows]
sandbox = "unelevated"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.cua_repl]
command = 'C:\Program Files\WindowsApps\OpenAI.Codex_26.1002.7124.0_x64__2p2nqsd0c76g0\app\ChatGPT.exe'
enabled = false

[desktop]
followUpQueueMode = "steer"

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."code-review@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true
