# Unix-specific configuration (Linux, macOS, WSL)
# Run via: ./install.sh (which loads this after install.conf.yaml)

- defaults:
    link:
        create: true
        relink: true

- clean:
    - '~'
    - '~/.config'
    - '~/.config/shellver/common'

- link:
    # Root rc files (required by shell spec)
    ~/.shellenv: config/shellenv
    ~/.profile: config/profile
    ~/.bashrc: config/bashrc
    ~/.bash_profile: config/bash_profile
    ~/.zshenv: config/zshenv
    ~/.zshrc: config/zshrc

    # Shell
    ~/.config/shell: config/shell
    ~/.config/bash: config/bash
    ~/.config/zsh: config/zsh
    ~/.config/tmux: config/tmux
    ~/.config/shellver/common: shellver

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [git config core.hooksPath .githooks, Setting up git hooks]
    - [./install/unix/shellver, Installing Shellver]

    # Shell
    - [./install/unix/fzf, Installing fzf]

    # CLI tools
    - [./install/unix/nvim, Installing neovim]
    - [./install/unix/uv, Installing uv]
    - [./install/unix/rg, Installing ripgrep]
    - [./install/unix/rclone, Installing rclone]
    - [./install/unix/gh, Installing GitHub CLI]

# User commands and binaries installed above
- link:
    ~/.local/bin/git-fetch-repos: bin/git-fetch-repos
    ~/.local/bin/git-filter-repo: bin/git-filter-repo
    ~/.local/bin/imgen: bin/imgen
    ~/.local/bin/reddit: bin/reddit
    ~/.local/bin/set-title: bin/set-title
    ~/.local/bin/push-notify:
        path: bin/push-notify
        if: '[ -n "$WSL_DISTRO_NAME" ]'

- shell:
    - ['. "$HOME/.shellenv"; shellver bump machine', Refreshing Shellver machine generation]
