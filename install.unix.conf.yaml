# Unix-specific configuration (Linux, macOS, WSL)
# Run via: ./install.sh (which loads this after install.conf.yaml)

- defaults:
    link:
        create: true
        relink: true

- clean:
    - '~'
    - '~/.config'

- link:
    # Zshell
    ~/.zshenv: config/zshenv
    ~/.zshrc: config/zshrc
    ~/.config/zsh: config/zsh

    # Tmux
    ~/.config/tmux: config/tmux

    # WSL->Windows push notification
    ~/.local/bin/push-notify:
        path: bin/push-notify
        if: '[ -n "$WSL_DISTRO_NAME" ]'

- install:
    - [install/unix/uv, Installing uv]
    - [install/unix/shellver, Installing Shellver]
    - [install/unix/fzf, Installing fzf]
    - [install/unix/tmux-plugins, Installing tmux plugins]
    - [install/unix/rg, Installing ripgrep]
    - [install/unix/rclone, Installing rclone]
    - [install/unix/nvim, Installing Neovim]
    - [install/unix/gh, Installing GitHub CLI]

- shell:
    - ['. "$HOME/.shellenv"; shellver bump machine', Refreshing Shellver machine generation]
