# Cross-platform configuration
# Platform-specific: install.unix.conf.yaml, install.windows.conf.yaml

- defaults:
    link:
        create: true
        relink: true

- clean:
    - '~'
    - '~/.config'
    - '~/.ssh'
    - '~/.local/bin'
    - '$XDG_DATA_HOME/jupyter'
    - '~/.local/share/jupyter'

- link:
    # Git / SSH
    ~/.config/git: config/git
    ~/.ssh/config: config/ssh/config

    # Editors
    ~/.vim: config/vim
    ~/.config/nvim: config/nvim

    # Languages
    ~/.config/python: config/python
    ~/.pdbrc: config/python/pdbrc
    ~/.config/npm: config/npm
    ~/.config/jupyter: config/jupyter
    $XDG_DATA_HOME/jupyter/nbextensions:
        path: config/jupyter/nbextensions
        if: '[ -n "$XDG_DATA_HOME" ]'
    ~/.local/share/jupyter/nbextensions:
        path: config/jupyter/nbextensions
        if: '[ -z "$XDG_DATA_HOME" ]'

    # Misc
    ~/.config/gh: config/gh
    ~/.config/readline: config/readline

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [git config core.hooksPath .githooks, Setting up git hooks]
