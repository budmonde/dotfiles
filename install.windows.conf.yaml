# Run via: .\install.ps1 (between install.before.conf.yaml and install.after.conf.yaml)
# Requires: admin shell (for symlinks), winget, python
#
# The profile-loader helper resolves MyDocuments at runtime and writes regular
# profile loaders, so a machine-specific symlink never enters OneDrive.

- clean:
    - '~'
    - '~/.local/bin'
    - "%LOCALAPPDATA%\\Packages\\Microsoft.WindowsTerminal_8wekyb3d8bbwe\\LocalState"

- link:
    # Powershell
    ~/.profile.ps1: config/profile.ps1

    # Windows terminal
    "%LOCALAPPDATA%\\Packages\\Microsoft.WindowsTerminal_8wekyb3d8bbwe\\LocalState\\settings.json":
        path: config/terminal/settings.json
        force: true # force needed to overwrite windows default

    # Windows launchers for bin commands
    ~/.local/bin/git-filter-repo.cmd: bin/git-filter-repo.cmd
    ~/.local/bin/imgen.cmd: bin/imgen.cmd
    ~/.local/bin/set-title.cmd: bin/set-title.cmd
    ~/.local/bin/push-notify.ps1: bin/push-notify.ps1
    ~/.local/bin/push-notify.cmd:
        path: bin/push-notify.cmd
        force: true
    ~/.local/bin/optimize-wsl-vhd.bat: bin/optimize-wsl-vhd.bat

- install:
    - [install/windows/winget/uv.ps1, Installing uv]
    - [install/windows/shellver.ps1, Installing Shellver]
    - [install/windows/profile-loader.ps1, Installing the PowerShell profile loader]
    - [install/windows/winget/powershell.ps1, Installing PowerShell 7]

- shell:
    - command: >-
        powershell -NoProfile -Command
        "& pwsh -NoProfile -Command \"if ((Get-ExecutionPolicy -Scope CurrentUser) -eq 'Restricted') { Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force }\""
      description: Setting PowerShell 7 execution policy

- install:
    - [install/windows/fzf.ps1, Installing fzf]
    - [install/windows/psreadline.ps1, Installing PSReadLine]
    - [install/windows/psfzf.ps1, Installing PSFzf]
    - [install/windows/completion-predictor.ps1, Installing CompletionPredictor]
    - [install/windows/winget/ripgrep.ps1, Installing ripgrep]
    - [install/windows/winget/rclone.ps1, Installing rclone]
    - [install/windows/winget/neovim.ps1, Installing Neovim]
    - [install/windows/winget/github-cli.ps1, Installing GitHub CLI]
    - [install/windows/fonts.ps1, Installing configured fonts]
    - [install/windows/debloat.ps1, Applying Windows debloat configuration]
