# Run via: .\install.ps1 (which loads this after install.conf.yaml)
# Requires: admin shell (for symlinks), winget, python
#
# The profile-loader helper resolves MyDocuments at runtime and writes regular
# profile loaders, so a machine-specific symlink never enters OneDrive.

- defaults:
    link:
        create: true
        relink: true

- clean:
    - '~'
    - '~/.config'
    - '~/.config/shellver/common'

- link:
    "%LOCALAPPDATA%\\Packages\\Microsoft.WindowsTerminal_8wekyb3d8bbwe\\LocalState\\settings.json":
        path: config/terminal/settings.json
        force: true
    ~/.config/shellver/common: shellver

    # Git Bash support: minimal bash config so rare bash sessions write history
    # to XDG-compliant paths (~/.local/state/bash/history) instead of
    # ~/.bash_history. No content changes needed; .bashrc / .bash_profile
    # already source ~/.config/{bash,shell}/.
    ~/.shellenv: config/shellenv
    ~/.profile: config/profile
    ~/.bashrc: config/bashrc
    ~/.bash_profile: config/bash_profile
    ~/.config/shell: config/shell
    ~/.config/bash: config/bash

- shell:
    - [powershell -NonInteractive -File install\windows\shellver.ps1, Installing Shellver]

    # Powershell
    - [powershell -NoProfile -File install\windows\profile-loader.ps1, Writing machine-local PowerShell profile loaders]
    - [powershell -NonInteractive -File install\windows\winget-install.ps1 -PackageId Microsoft.PowerShell, Installing PowerShell 7]
    - command: >-
        powershell -NoProfile -Command
        "& pwsh -NoProfile -Command \"if ((Get-ExecutionPolicy -Scope CurrentUser) -eq 'Restricted') { Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force }\""
      description: Setting PowerShell 7 execution policy
    - [powershell -NonInteractive -File install\windows\fzf.ps1, Installing fzf]

    # PowerShell modules (bootstraps PackageManagement if needed).
    # Invoked via pwsh so modules land under Documents\PowerShell\Modules
    # rather than Documents\WindowsPowerShell\Modules.
    - [pwsh -NonInteractive -File install\windows\psreadline.ps1, Upgrading PSReadLine]
    - [pwsh -NonInteractive -File install\windows\psfzf.ps1, Installing PSFzf]
    - [pwsh -NonInteractive -File install\windows\completion-predictor.ps1, Installing CompletionPredictor]

    # CLI tools
    - [powershell -NonInteractive -File install\windows\winget-install.ps1 -PackageId Neovim.Neovim, Installing Neovim]
    - [powershell -NonInteractive -File install\windows\winget-install.ps1 -PackageId astral-sh.uv, Installing uv]
    - [powershell -NonInteractive -File install\windows\winget-install.ps1 -PackageId BurntSushi.ripgrep.MSVC, Installing ripgrep]
    - [powershell -NonInteractive -File install\windows\winget-install.ps1 -PackageId Rclone.Rclone, Installing rclone]
    - [powershell -NonInteractive -File install\windows\winget-install.ps1 -PackageId GitHub.cli, Installing GitHub CLI]

    - [powershell -NonInteractive -File install\windows\fonts.ps1, Installing fonts]

    - [powershell -NonInteractive -File install\windows\debloat.ps1, Removing bloatware]

# Windows command launchers and their Python support files
- defaults:
    link:
        create: true
        relink: true

- link:
    ~/.local/bin/git-fetch-repos: bin/git-fetch-repos
    ~/.local/bin/git-fetch-repos.cmd: bin/git-fetch-repos.cmd
    ~/.local/bin/git-filter-repo: bin/git-filter-repo
    ~/.local/bin/git-filter-repo.cmd: bin/git-filter-repo.cmd
    ~/.local/bin/imgen: bin/imgen
    ~/.local/bin/imgen.cmd: bin/imgen.cmd
    ~/.local/bin/reddit: bin/reddit
    ~/.local/bin/reddit.cmd: bin/reddit.cmd
    ~/.local/bin/set-title.cmd: bin/set-title.cmd
    ~/.local/bin/push-notify.ps1: bin/push-notify.ps1
    ~/.local/bin/push-notify.cmd:
        path: bin/push-notify.cmd
        force: true
    ~/.local/bin/optimize-wsl-vhd.bat: bin/optimize-wsl-vhd.bat

- shell:
    - [powershell -NonInteractive -Command "shellver bump machine", Refreshing Shellver machine generation]
